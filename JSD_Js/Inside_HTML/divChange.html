<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Div_Change</title>
    <style>
      #d1 {
        height: 300px;
        width: 300px;
        border-radius: 20px;
        background-color: blue;
      }
    </style>
  </head>
  <body>
    <div id="d1" onclick="first()" ondblclick="second()"></div>
    <br />
    
    <script>
      function first() {
        document.getElementById("d1").style.height = "500px";
        document.getElementById("d1").style.width = "500px";
        document.getElementById("d1").style.backgroundColor = "green";
        document.getElementById("d1").style.transition = "5s";
      }
      function second() {
        document.getElementById("d1").style.height = "100px";
        document.getElementById("d1").style.width = "100px";
        document.getElementById("d1").style.backgroundColor = "red";
        document.getElementById("d1").style.transition = "5s";
      }
    </script>
  </body>
</html>

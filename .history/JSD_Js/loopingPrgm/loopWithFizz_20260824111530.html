<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FizzLoop</title>
</head>
<body>
    <script>
        
        for(let i=1;i<=10;i++){
           if(i%3==0){
            document.write("Fizz</br></br>");
           }
           else{
            document.write(i+"</br></br>");
           }
        }
        document.write("</br><hr></br>");
        
        for(let i=1 ;i<=100;i++){
            if(i%7==0 && i%10==0){
            document.write(i+" = Buzz</br></br>");
           }
        }
        document.write("</br><hr></br>");
        for(let i=1;i<=100;){
            if(i%3==0 && i%5==0){
                document.write(i+" = FizzBuzz<br><br>");
            }
            else if(i%3==0){
                 document.write(i+" = Fizz<br><br>");
            }
            else if(i%5==0){
                 document.write(i+" = Buzz<br><br>");
            }
            else{
                 document.write(i+"<br><br>");
            }

        }
    </script>
</body>
</html>

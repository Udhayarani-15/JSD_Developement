<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CountSumOut</title>
  </head>
  <body>
    <script>
      document.write("<h4>Prime Number</h4>");

      for (let y = 2; y <= 100; y++) {
        let num = y;
        let pcount = 0;
        for (let i = 2; i < num; i++) {
          if (num % i == 0) {
            pcount++;
          }
        }
        if (pcount == 0) {
          document.write(num+"<br>");
        }
      }
       document.write("</br><hr></br>");
       document.write("<h4>Armstrong Number</h4>");
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForLoopIncDec</title>
</head>
<body>
    <script>
        document.write("<h1>Increment 1</h1> </br></br>")
        for(let i=1;i<=10;i++){
            document.write("value = "+i+"</br></br>");
        }
         document.write("</br><h1>Decrement 1</h1> </br>")
        for(let i=10;i>=1;i--){
            document.write("value = "+i+"</br></br>");
        }
        document.write("</br><h1>Decrement 2</h1> </br>")
        for(let i=100;i>=1;i--){
            document.write("value = "+i+"</br></br>");
        }
        document.write("<h1>Increment Name</h1> </br></br>")
        for(let i=1;i<=10;i++){
            document.write(i+". Udhayarani Sankar</br></br>");
        }
        document.write("<h1>Increment Name</h1> </br></br>");
        let a = 1
        for(let i=1;i<=10;i++){
            document.write(i+". Udhayarani Sankar</br></br>");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReverseNumber</title>
</head>
<body>
    <script>
        let num = 1545451;
        let temp = num;
        let rev=0;
        document.write("Num = "+num+"</br><br>");
        while(num>0){
            let rem = num %10;
            rev= (rev*10)+rem;
            num = parseInt(num/10);
        }
        document.write("Rev = "+rev+"<br><br>");
        if(rev == temp){
            document.write(temp +" is palindrome "+"<br><br>");
        }
        else{
             document.write(temp +" is not palindrome "+"<br><br>");
        }
        document.write("</br><hr><br>");
        document.write("")

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>primeAndMore</title>
</head>
<body>
    <h1>Prime Number</h1>
    <input
      type="number"
      id="ip2"
      placeholder="enter the Number to check"
    /><br /><br />
    <button type="submit" onClick="primeFind()">FindPrime</button>
    <p id="p3"></p>
    <p id="p4"></p><hr>
    <h1>Abundent Number</h1>
    <input
      type="number"
      id="ip1"
      placeholder="enter the Number to check"
    /><br /><br />
    <button type="submit" onClick="abudantFind()">FindPrime</button>
    <p id="p1"></p>
    <p id="p2"></p><hr>
    <script>
        function primeFind() {
        let number = Number(document.getElementById("ip2").value);
        let pcount = 0;
        for (let i = 1; i < number; i++) {
          if (i % number == 0) {
            pcount++;
          }
        }
        document.getElementById("p3").innerText = pcount;
        if (pcount == 0) {
          document.getElementById("p4").innerText =
            number + " is a prime number";
        } else {
          document.getElementById("p4").innerText =
            num + " is composite number";
        }
      }
      document.write("</br><hr></br>");
      function abudantFind() {

    </script>
</body>
</html>

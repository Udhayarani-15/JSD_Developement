<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsertValue</title>
</head>
<body>
    <input type="text" id="ip1"  placeholder="enter array value" ><br><br/>
    <button type="submit" onclick="arrAdd()">Add</button>
    <p id="p1"></p>
    <script>
        let value = document.getElementById("ip1").value;
        let arr=[];
        function arrAdd(){
            arr.push(value);
            for(let i=0;i<arr.length;i++)
            document.getElementById("p1").innerText=arr[value];
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountSumOut</title>
</head>
<body>
    <script>
      document.write("<h4>Prime Number</h4>");
       let pcount = 0;
      for (let y = 1; y <= 100; y++) {
        let num = y;
       
        for (let i = 2; i < num; i++) {
          if (i % number == 0) {
            pcount++;
          }
        }
          
      }
      document.write(pcount + " is the number of prime numbers<br>");
    </script>
</body>
</html>

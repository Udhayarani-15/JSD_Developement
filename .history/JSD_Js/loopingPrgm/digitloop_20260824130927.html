<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>whileloop</title>
</head>
<body>
    <script>
       let num = 1463;
       
       while(num > 0){
        let rem = num % 10;
        document.write(rem+"<br><br>");
        num = parseInt(num/10);
       }
       document.write("<br><hr><br>");

       let num1 = 1463;
       
       while(num1 > 0){
        let rem = num % 10;
        document.write(rem+"<br><br>");
        num = parseInt(num/10);
       }
       document.write("<br><hr><br>");
    </script>
</body>
</html>

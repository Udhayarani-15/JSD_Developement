<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForLoopIncDec</title>
</head>
<body>
    <script>
        document.write("<h1>Increment </br>")
        for(let i=1;i<=10;i++){
            document.write("value = "+i+"</br>");
        }
         document.write("Decrement </br>")
        for(let i=10;i>=1;i--){
            document.write("value = "+i+"</br>");
        }
    </script>
</body>
</html>

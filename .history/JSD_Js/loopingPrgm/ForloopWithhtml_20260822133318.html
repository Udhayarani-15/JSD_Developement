<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForLoopWithHtml</title>
    <!--<link rel="stylesheet" href="../Inside_HTML/cssSix/external.css">-->
</head>
<body>
    <div class="d1">
        <h1>For Loop Increment</h1>
        <div  id="d2">
            <input type="number" id="ip1" placeholder="Enter The Number To Multiple"><br>
            <button type="submit" onclick="Multiple()">Calculate</button>
            <p id="p1"></p>
        </div>
        
    </div>
    <script>
        function Multiple(){
            let num = Number(document.getElementById("ip1").value);
            document.write(num+" Table</br></br>");
            for( let i=1 ;i<=5 ; i++){
                
                document.write( num+" * "+i+" = "+(num*i)+"</br></br>");
                //document.getElementById("p1").innerText = num+" * "+i+" = "+(num*i);
            }
        }
    </script>
</body>
</html>

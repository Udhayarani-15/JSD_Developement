<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>whileloop</title>
</head>
<body>
    <script>
       let num = 1463;
       let rem =0;
       while(num > 0){
        rem = num % 10;
        document.write(rem+"<br><br>");
        num = num /10
       }
    </script>
</body>
</html>

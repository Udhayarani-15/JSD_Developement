<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>evenSumloop</title>
</head>
<body>
    <script>
        for(let i=1;i<=10;i++){
           if(i%2==0){
            document.write(i+" = Even</br></br>");
           }
           else{
            document.write(i+" = Odd</br></br>");
           }
        }
        document.write("</br><hr></br>");
        let sum =0;
        for(let i=1;i<=10;i++){
           if(i%2==0){
              sum+=i;
           }
        }
        document.write(sum+" is the Sum of even numbers");
        document.write("</br><hr></br>");
        let count =0;
        for(let i=1;i<=10;i++){
           if(i%2==0){
              count++;
           }
        }
        document.write(sum+" is the Sum of even numbers");
        document.write("</br><hr></br>");
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReverseNumber</title>
</head>
<body>
    <script>
        let num = 1545451;
        let temp = num;
        let rev=0;
        while(num>0){
            let rem = num %10;
            rev= rev*10+rem;
            num = num/10;
        }
        document.write("Num = "+num+"</br><br>");
        document.write("Rev = "+rev+"<br><br>");
        if(rev == temp){
            document.write(temp +" is  "+rev);
        }

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Size_Inc</title>
    <style></style>
</head>
<body>
    <h3 id="inc">Udhaya</h3>
    <button type="submit" onclick="big()"> A+ </button>
    <button type="submit" onclick="small()"> A- </button>
    <button type="reset" onclick="res()">Reset</button>
    <script>
        function big(){
            
            document.getElementById("inc").style.fontSize = "16px";
        }
        function small(){
            
            document.getElementById("inc").style.fontSize = "8px";
        }
        function res(){
            
            document.getElementById("inc").style.fontSize = "12px";
        }

    </script>
</body>
</html>

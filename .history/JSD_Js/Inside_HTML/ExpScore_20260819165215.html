<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score_Experence</title>
</head>
<body>
    <h2>Score_Experence</h2>
    <input type="number" id="ip1" placeholder="Enter The Score"><br>
    <input type="number" id="ip2" placeholder="Enter The Experience"><br>
    <p id="p1"></p>
    <button type="submit" onclick="sal()">Click</button>
    <script>
        function sal(){
            let score = Number(document.getElementById("ip1").value);
            if(score>=85){
                let exp = Number(document.getElementById("ip2").value);
                if(exp>0 && exp<=2){
                    document.getElementById("p1").innerText = " salary = 5000";
                }
                else if(exp>=3 && exp<5){
                    document.getElementById("p1").innerText = "salary = 1000";
                }
                else if(exp>=5){
                    document.getElementById("p1").innerText = "Salary = 20000";
                }
                else{
                    document.getElementById("p1").innerText = "";
                }
            }
        }
    </script>
</body>
</html>

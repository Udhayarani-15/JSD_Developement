<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saving_Interest_Calculator</title>
  </head>
  <body>
    <h2>Saving_Interest_Calculator</h2>
    <div class="d1">
      <form method="" action="">
        <label>Deposite</label><input type="number" id="ip1" /><br />

        <button type="submit" onclick="Interest_Cal()">Calculate</button>
      </form>
    </div>
    <script>
      function Interest_Cal() {
        let deposit = document.getElementById("ip1");

        if (deposit >= 100000) {
          let interest = deposit * (8 / 100);
          document.write("Deposite Amount = " + deposit + "</br>");
          document.write(
            "Interest = 8% </br>" + "Interest Amount = " + interest + "</br>",
          );
          document.write(
            "Total Maturity Amount = " + (deposit + interest) + "</br>",
          );
        } else if (deposit >= 50000) {
          let interest = deposit * (6 / 100);
          document.write("Deposite Amount = " + deposit + "</br>");
          document.write(
            "Interest = 6% </br>" + "Interest Amount = " + interest + "</br>",
          );
          document.write(
            "Total Maturity Amount = " + (deposit + interest) + "</br>",
          );
        } else if (deposit < 50000) {
          let interest = deposit * (4 / 100);
          document.write("Deposite Amount = " + deposit + "</br>");
          document.write(
            "Interest = 4% </br>" + "Interest Amount = " + interest + "</br>",
          );
          document.write(
            "Total Maturity Amount = " + (deposit + interest) + "</br>",
          );
        } else {
          document.write("Invalide Deposite amount");
        }
      }
    </script>
  </body>
</html>

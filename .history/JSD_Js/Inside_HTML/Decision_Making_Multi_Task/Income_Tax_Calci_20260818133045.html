<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income_Tax</title>
</head>
<body>
    <h2>Income_Tax_Calculator</h2>
    <script>
        let bill = Number(prompt("Enter the bill amount"));
        if(bill>1000){
            let dis = bill * (10/100);
            document.write("Bill Amount = "+bill+"</br>");
            document.write("Discount amount = "+ dis+"</br>");
            document.write("Total Bill Amount After Discount = "+(bill-dis)+"</br>");
        }
    </script>
</body>
</html>

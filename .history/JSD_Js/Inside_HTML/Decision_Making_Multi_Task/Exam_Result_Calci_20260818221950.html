<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam_Result</title>
</head>
<body>
    <h2>Exam_Result_Calculation</h2>
    <div class="d1">
      <form method="" action="">
        <label>Balls</label><input type="number" id="ip1" /><br />
        <label>Runs</label><input type="number" id="ip2" /><br />
        <label>Maths</label><input type="number" id=""
        <button type="submit" onclick="cricket()">Calculate</button>
      </form>
    </div>
    <script>
        let tam = Number(prompt("Enter the tamil mark"));
        let eng = Number(prompt("Enter the English mark"));
        let mat = Number(prompt("Enter the Maths mark"));
        let sci = Number(prompt("Enter the science mark"));
        let soc = Number(prompt("Enter the Social mark"));
        let tot = tam+eng+mat+sci+soc;
        let avg = tot/5;
        if(avg >= 50){
            document.write("Total Mark = "+tot+"</br>");
            document.write("Average Mark = "+avg+"</br>");
            document.write("Pass");
        }
        else if(avg < 50){
            document.write("Total Mark = "+tot+"</br>");
            document.write("Average Mark = "+avg+"</br>");
            document.write("Fail");
        }
        else{
            document.write("Invalide Mark value");
        }
    </script>
</body>
</html>

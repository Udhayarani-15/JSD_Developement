<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saving_Interest_Calculator</title>
</head>
<body>
    <h2>Saving_Interest_Calculator</h2>
    <script>
        let deposit = Number(prompt("Enter the Deposit amount"));
       
        if(deposit >= 100000){
            let interest = deposit*(8/100);
            document.write("Deposite Amount = "+deposit+"</br>");
            document.write("Interest = 8% </br>"+"Interest Amount = "+interest+"</br>");
            document.write("Total Maturity Amount = "+(deposit+interest)+"</br>");
        }
        else if(deposit >= 50000){
            let interest = deposit*(6/100);
            document.write("Deposite Amount = "+deposit+"</br>");
            document.write("Interest = 8% </br>"+"Interest Amount = "+interest+"</br>");
            document.write("Total Maturity Amount = "+(deposit+interest)+"</br>");
        }
       else if(deposit >= 100000){
            let interest = deposit*(8/100);
            document.write("Deposite Amount = "+deposit+"</br>");
            document.write("Interest = 8% </br>"+"Interest Amount = "+interest+"</br>");
            document.write("Total Maturity Amount = "+(deposit+interest)+"</br>");
        }
        else{
            document.write("Invalide Salary Amount or Experience");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket_Strike_Rate_Calculator</title>
</head>
<body>
    <h2>Cricket_Strike_Rate_Calculator</h2>
    <script>
        let balls = Number(prompt("Enter the number of balls"));
        let runs = Number(prompt("Enter the number of runs "));
        let s_rate = (runs/balls)*100;
        if(s_rate >150){
        
            document.write("Number Of Balls = "+balls+"</br>");
            document.write("Number of Runs = "+runs+"</br>");
            document.write("Strike Rate = "+s_rate+"</br>");
            document.write("Excellent </br>");
        }
        else if(s_rate >100){
        
            document.write("Number Of Balls = "+balls+"</br>");
            document.write("Number of Runs = "+runs+"</br>");
            document.write("Strike Rate = "+s_rate+"</br>");
            document.write("Good </br>");
        }
       else if(s_rate<=100){
        
            document.write("Number Of Balls = "+balls+"</br>");
            document.write("Number of Runs = "+runs+"</br>");
            document.write("Strike Rate = "+s_rate+"</br>");
            document.write("Average </br>");
        }
        else{
            document.write("Invalide S");
        }
    </script>
</body>
</html>

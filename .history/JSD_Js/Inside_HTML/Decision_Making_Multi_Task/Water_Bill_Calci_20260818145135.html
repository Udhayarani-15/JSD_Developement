<html lang="en">
<head>

    <title>Water_Bill_Calculator</title>
</head>
<body>
    <h2>Water_Bill_Calculator</h2>
    <script>
        let liter = Number(prompt("Enter the bill amount"));
        if(liter<=500){
            let per_liter = 1;
            document.write("Number Of Liter = "+ liter+"</br>");
            document.write("Amount Per Liter = 1 </br>");
            document.write("Total Bill Amount = "+(liter*per_liter)+"</br>");
        }
        else if(income>=250000 && income<=500000){
            let per_liter = 2;
            document.write("Number Of Liter = "+ liter+"</br>");
            document.write("Amount Per Liter = 2 </br>");
            document.write("Total Bill Amount = "+(liter*per_liter)+"</br>");
            
        }
        else if(income>500000){
            tax = income*(10/100);
            document.write("Income = "+income+"</br>");
            document.write("Tax = 10% </br>");
            document.write("Tax amount = "+ tax+"</br>");
            
        }
        else{
            document.write("Invalide Income");
        }
    </script>
</body>
</html>

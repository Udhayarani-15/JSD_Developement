<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant_bill_Generator</title>
</head>
<body>
    <h2>Restaurant_bill_Generator</h2>
    <div class="d1">
      <form method="" action="">
        <label>Restaurant Bill</label><input type="number" id="ip1" /><br />
        <button type="submit" onclick="restaurant()">Calculate</button>
      </form>
    </div>
    <script>
        function restaurant(){
            let bill = document.getElementById("ip1").value;
        if(bill>1000){
            let dis = bill * (10/100);
            document.write("Bill Amount = "+bill+"</br>");
            document.write("Discount amount = "+ dis+"</br>");
            document.write("Total Bill Amount After Discount = "+(bill-dis)+"</br>");
        }
        else{
            document.write("Bill Amount = "+bill+"</br>");
            document.write("No Discount</br>");
            document.write("Total Bill Amount After Discount = "+bill+"</br>");
        }
        }
    </script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saving_Interest_Calculator</title>
  </head>
  <body>
    <h2>Saving_Interest_Calculator</h2>
    <div class="d1">
     
        <label>Deposite</label><input type="number" id="ip1" /><br />

        <button type="submit" onclick="Interest_Cal()">Calculate</button><br>
        <p id="p1"></p>
        <p id="p2"></p>
        <p id="p3"></p>
      
    </div>
    <script>
      function Interest_Cal() {
        let deposit = Number(document.getElementById("ip1").value);

        if (deposit >= 100000) {
          let interest = deposit * (8 / 100);
          document.getElementById("p1").innerText= ("Deposite Amount = " + deposit);
          document.getElementById("p2").innerText= ( "Interest = 8% </br>" + "Interest Amount = " + interest );
          document.getElementById("p3").innerText= ("Total Maturity Amount = " + (deposit + interest) );
        } else if (deposit >= 50000) {
          let interest = deposit * (6 / 100);
          document.getElementById("p1").innerText= ("Deposite Amount = " + deposit );
          document.getElementById("p2").innerText= (
            "Interest = 6% </br>" + "Interest Amount = " + interest 
          );
          document.getElementById("p3").innerText= (
            "Total Maturity Amount = " + (deposit + interest) + "</br>"
          );
        } else if (deposit < 50000) {
          let interest = deposit * (4 / 100);
          document.getElementById("p1").innerText= ("Deposite Amount = " + deposit + "</br>");
          document.getElementById("p2").innerText= (
            "Interest = 4% </br>" + "Interest Amount = " + interest + "</br>"
          );
          document.getElementById("p3").innerText= (
            "Total Maturity Amount = " + (deposit + interest) + "</br>"
          );
        } else {
          document.getElementById("p1").innetText= ("Invalide Deposite amount");
        }
      }
    </script>
  </body>
</html>

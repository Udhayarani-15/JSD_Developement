<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket_Strike_Rate_Calculator</title>
</head>
<body>
    <h2>Cricket_Strike_Rate_Calculator</h2>
    <div class="d1">
        <form method="" action="">
        <label>Balls</label><input type="number" id="ip1"><br>
        <label>Runs</label><input type="number" id="ip2"><br>
        <label>Strike Rate</label><input type="number" id="ip3"><br>
        <button type="submit" onclick="product()">Calculate</button>  
    </form>
    </div>
    <script>
        function 
        let balls = document.getElementById("ip1").value;
        let runs = document.getElementById("ip1").value;
        let s_rate = (runs/balls)*100;
        if(s_rate >150){
        
            document.write("Number Of Balls = "+balls+"</br>");
            document.write("Number of Runs = "+runs+"</br>");
            document.write("Strike Rate = "+s_rate+"</br>");
            document.write("Excellent </br>");
        }
        else if(s_rate >100){
        
            document.write("Number Of Balls = "+balls+"</br>");
            document.write("Number of Runs = "+runs+"</br>");
            document.write("Strike Rate = "+s_rate+"</br>");
            document.write("Good </br>");
        }
       else if(s_rate<=100){
        
            document.write("Number Of Balls = "+balls+"</br>");
            document.write("Number of Runs = "+runs+"</br>");
            document.write("Strike Rate = "+s_rate+"</br>");
            document.write("Average </br>");
        }
        else{
            document.write("Invalide Strike Rate or balls or runs");
        }
    </script>
</body>
</html>

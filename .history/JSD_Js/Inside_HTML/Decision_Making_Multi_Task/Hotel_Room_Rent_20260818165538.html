      </form>

    <script>
        let days = Number(prompt("Enter the number of days the customer stayed"));
        if(days<=3){
            let per_day_cost = 1000;
            document.write("Number of Days = "+days+"</br>");
            document.write("Per Day = 1000 </br>");
            document.write("Total Rent Amount = "+(per_day_cost*days)+"</br>");
        }
        else if(days<=7){
            let per_day_cost = 900;
            document.write("Number of Days = "+days+"</br>");
            document.write("Per Day = 900 </br>");
            document.write("Total Rent Amount = "+(per_day_cost*days)+"</br>");
            
        }
        else if(days>7){
            let per_day_cost = 800;
            document.write("Number of Days = "+days+"</br>");
            document.write("Per Day = 800 </br>");
            document.write("Total Rent Amount = "+(per_day_cost*days)+"</br>");
            
        }
        else{
            document.write("Invalide days value");
        }
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div_Change</title>
    <style>
        #d1{
            height: 500px;
            width: 500px;
            background-color: blue;
        }
    </style>
</head>
<body>
    <div id="d1">

    </div>
    <button type="submit" onclick="first()" ondblclick="second()">Click</button>
    <script>
        function first(){
            document.getElementById("d1").style.height="900px";
            document.getElementById("d1").style.width="900px";
            document.getElementById("d1").style.backgroundColor="green";
            document.getElementById("d1").style.transition="5ms";
        }
        function second(){
            document.getElementById("d1").style.height="200px";
            document.getElementById("d1").style.width="200px";
            document.getElementById("d1").style.Back="red";
            document.getElementById("d1").style.transition="5ms";
        }
    </script>
</body>
</html>

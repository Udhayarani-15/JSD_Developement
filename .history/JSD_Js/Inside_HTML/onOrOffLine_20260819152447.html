<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On_Or_Offline</title>
</head>
<body id="b1">
    <h1 id="line">Last Seen..</h1>
    <button type="submit" onclick="present()">Online</button>
    <button type="submit" onclick="absent()">Offline</button>
    <script>
        function present(){
            document.getElementById("line").innerText = "Online..";
            document.getElementById("line").style.color = "green";
            document.getElementById("line").style.transition = "2s";
            document.getElementById("b1").style.backgroundColor = "lightgreen";
            document.getElementById("b1").style.transition = "s"

        }
        function absent(){
            document.getElementById("line").innerText = "Offline..";
            document.getElementById("line").style.color = "Red";
            document.getElementById("line").style.transition = "5s";
            document.getElementById("b1").style.backgroundColor = "lightcoral";
            document.getElementById("b1").style.transition = "10s"
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview_Process</title>
    <style>
        #ip2{
            visibility: hidden;
        }
        #ip3{
            visibility: hidden;
        }
    </style>
</head>
<body>
    <h2>Interview_Result_Process</h2>
    <input type="number" id="ip1" placeholder="Enter Aptitude Mark"><br>
    <input type="number" id="ip2" placeholder="Enter GD Mark" disabled><br>
    <input type="number" id="ip3" placeholder="Enter Tech Mark" disabled><br>
    <button type="submit" onclick="aptiR1()">Next</button>
    <script>
        function aptiR1(){
            let apti = Number(document.getElementById("ip1").value);
            if(apti  >= 50){
                document.getElementById("p1").style.visibility = "visible";
                let gd = Number(document.getElementById("ip2").value);
                if(gd >= 65){
                    document.getElementById("p2").style.visibility = "visible";
                    let tech = Number(document.getElementById("ip3").value);
                }
            }
        }
    </script>
</body>
</html>

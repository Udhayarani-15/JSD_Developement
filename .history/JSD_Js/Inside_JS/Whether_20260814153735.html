<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph</title>
</head>
<body>
    <script>
        let D=Number(prompt("Enter the X-axis "));
        
        if(D<0 ){
            document.write(D+" = Freezing Whether");
        }
        else if(D==0 && D>10){
            document.write(D+" = Very Cold Whether");
        }
        else if(D==10 && D>20){
            document.write(D+" = Very Cold Whether");
        }
        else if(D==20 && D>30){
            document.write(D+" = Very Cold Whether");
        }
        else if(D==30 && D>40){
            document.write(D+" = Very Cold Whether");
        }
        else if(D>= && D>10){
            document.write(D+" = Very Cold Whether");
        }
        
    </script>
</body>
</html>

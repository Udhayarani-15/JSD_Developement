<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restauraant_bill_Generator</title>
</head>
<body>
    <h2>Restauraant_bill_Generator</h2>
    <script>
        let bill = Number(prompt("Enter the bill amount"));
        if(bill>1000){
            let dis = bill * (10/100);
            document.write("Bill Amount = "+bill+"</br>");
            document.write("Discount amount = "+ dis+"</br>");
            document.write("")
        }
    </script>
</body>
</html>

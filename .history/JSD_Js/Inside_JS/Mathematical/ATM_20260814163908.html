<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM</title>
</head>
<body>
    <script>
        let initial_amount=10000;
        
        document.write("Initital Amount = "+initial_amount+"</br>");
        let choice =Number(prompt("Enter The Action Do You Want </br>1.Check Balance</br>2.Withdraw</br>3.Deposite"));
        switch(choice){
            case 1:
                document.write("Balance Amount = "+initial_amount+"</br>");
                break;
            case 2:
                let Withdraw=Number(prompt("Enter the amount to withdraw"));
                document.write("Withdraw Amount = "+Withdraw+"</br>")
                document.write("Balance Amount = "+(initial_amount-Withdraw)+"</br>");
                break
 
        }
    </script>
</body>
</html>

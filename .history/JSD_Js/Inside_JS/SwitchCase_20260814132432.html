<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Case</title>
</head>
<body>
    <script>
        
      let a = Number(prompt("Enter the a value"));
      let b = Number(prompt("Enter the b value"));
      let c = prompt("Enter the  c value ");
      document.write("Arthmetic by c number : ");
      document.write(a);
      document.write(b);
      document.write("</br>");
      switch(c){
        case "add":
            document.write("a+b "+ a+b);
            break;
        case "sub":
            document.write("a+b "+ a+b);
            break;
        case "add":
            document.write("a+b "+ a+b);
            break;
        case "add":
            document.write("a+b "+ a+b);
            break;
        case "add":
            document.write("a+b "+ a+b);
            break;
      }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If_ladder</title>
</head>
<body>
    <script>
        let Ug=Number(prompt("Enter ug 0 or 1"));
        let Pg=Number(prompt("Enter pg 0 or 1"));
        let Phd=Number(prompt("Enter phd 0 or 1"));
        let Edu = " ";

        if(Ug==1){
            Edu+="Ug, ";
        }
        if(Pg==1){
            Edu+="Pg, ";
        }
        if(Phd==1){
            Edu+="Phd";
        }

        document.write(Edu);
        document.write("</br>");
        <document.write("Value Check");
        let value=Number(prompt("Enter any integer"));
        if(value<0){
            document.write("-1");
        }
        else if(value>0){
            document.write("1");
        }
        else if(value==0){
            document.write()
        }
    </script>
</body>
</html>

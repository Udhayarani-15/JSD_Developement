<html>
    <head>
        <title>Position_three</title>
        <style>
            #one{
                background-color: yellow;
                height: 100px;
                width: 100px;
                position: relative;
                z-index: 1;
            }
    
        
            #two{
                background-color: blue;
                height: 100px;
                width: 100px;
                position: absolute;
                top:50px;
                left:50px;
                z-index: 0;
            }
        </style>
    </head>
    <body>
        <div id="one"></div>
        <div id="two"></div>
       
    </body>
</html>

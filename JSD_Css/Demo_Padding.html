<html>
    <head>
        <title>Padding_Demo</title>
        <style>
            h1{
                color: blue;
                background-color: yellow;
                border: 2px solid brown;
                text-align: center;
                padding-top: 20px;
                padding-bottom: 20px;
                margin: 30px;
                text-shadow: 2px 2px 2px lightblue;
                box-shadow: 3px 3px 3px green;
            }
            img{
                border-radius: 50%;
            }
            img:hover {
                border-radius: 0%;
            }
        </style>
    </head>
    <body>
        <h1>Welcome!</h1>
        <img src="images/fever.jpg" alt="Circle" height="500px" width="500px">
    </body>
</html>

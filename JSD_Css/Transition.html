<html>
    <head>
        <title></title>
        <style>
            #b1{
                border: 2px solid blue;
                border-radius: 5px;
                padding: 10px;
                margin: 30px;
                transition: 2s;

            }
            #b2{
                background-color: red;
                color: white;
                border-radius: 5px;
                padding: 10px;
                transition: 2s;
            }
            #b1:hover{
                background-color: lightgreen;
                border: 2px solid red;
            }
            #b2:hover{
                background-color: gold;
                color: black;
                
            }
        </style>
    </head>
    <body>
        <h3>Transition</h3>
        
            <button id="b1">Boys_Group</button>
            <button id="b2">Girls_Group</button>
        
    </body>
</html>

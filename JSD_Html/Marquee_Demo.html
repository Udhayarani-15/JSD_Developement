<html>
  <head>
    <title>MarqeeDemo</title>
  </head>
  <body>
    <marquee behavior="slide" scrollamount="30">Welcome to Marquee!!</marquee>
    <h3>Table Marquee</h3>
    <table border="1">
      <tr>
        <td>
          <img
            src="images/Circle.jpg"
            alt="Circle"
            height="100px"
            width="100px"
          />
        </td>
        <td>
          <marquee
            behavior="scroll"
            direction="down"
            height="100px"
            width="100px"
          >
            Welcome All!
          </marquee>
        </td>
        <td>
          <img
            src="images/Circle.jpg"
            alt="Circle"
            height="100px"
            width="100px"
          />
        </td>
      </tr>
      <tr>
        <td>
          <marquee behavior="scroll" direction="right">Welcome All!</marquee>
        </td>
        <td>
          <img
            src="images/Circle.jpg"
            alt="Circle"
            height="100px"
            width="100px"
          />
        </td>
        <td>
          <marquee behavior="scroll" direction="left">Welcome All!</marquee>
        </td>
      </tr>
      <tr>
        <td>
          <img
            src="images/Circle.jpg"
            alt="Circle"
            height="100px"
            width="100px"
          />
        </td>
        <td>
          <marquee
            behavior="scroll"
            direction="up"
            height="100px"
            width="100px"
          >
            Welcome All!
          </marquee>
        </td>
        <td>
          <img
            src="images/Circle.jpg"
            alt="Circle"
            height="100px"
            width="100px"
          />
        </td>
      </tr>
    </table>
  </body>
</html>

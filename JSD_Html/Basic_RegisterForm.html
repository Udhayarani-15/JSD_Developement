<html>
    <head>
        <title>Basic_Register_Form</title>
    </head>
    <body>
        <h2>Basic_Register_Form</h2>
        <form method="" action="">
            <table border="1" cellpadding="15" bgcolor="lightgray">
                <tr>
                    <th>Name :</th>
                    <td><input></td>
                </tr>
                <tr>
                    <th>Education<br>Qualification :</th>
                    <td>
                        <input type="checkbox">UG
                        <input type="checkbox">PG
                        <input type="checkbox">Phd
                    </td>
                </tr>
                <tr>
                    <th>Gender :</th>
                    <td>
                        <input type="radio">Male
                        <input type="radio">Female
                    </td>
                </tr>
                <tr>
                    <th>DOB :</th>
                    <td><input type="date"></td>
                </tr>
                <tr>
                    <th>Age :</th>
                    <td><input type="number"></td>
                </tr>
                <tr>
                    <th>Resume :</th>
                    <td><input type="file"></td>
                </tr>
                <tr>
                    <td><input type="Reset" value="Clear"></td>
                    <td><input type="submit" value="Register"></td>
                </tr>
            </table>
        </form>
    </body>
</html>

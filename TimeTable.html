<html>
    <head>
        <title>Time_Table</title>
    </head>
    <body>
        <h3>Time Table</h3>
        <table border="1" bgcolor="lightgray" height="200px" width="50%">
            <tr>
                <th colspan="6">Time Table</th>
            </tr>
            <tr>
                <th>Days</th>
                <th>1</th>
                <th>2</th>
                <th>Break</th>
                <th>3</th>
                <th>4</th>
            </tr>
            <tr>
                <th>Monday</th>
                <td>Science</td>
                <td>English</td>
                <th rowspan="4">lunch</th>
                <td>Science</td>
                <td>Maths</td>
            </tr>
            <tr>
                <th>Tuesday</th>
                <td>Maths</td>
                <td>Tamil</td>
                <td>Maths</td>
                <td>Science</td>
            </tr>
            <tr>
                <th>Wednesday</th>
                <td>English</td>
                <td>Maths</td>
                <td>Social</td>
                <td>English</td>
            </tr>
            <tr>
                <th>Thursday</th>
                <td>Social</td>
                <td>Social</td>
                <td>English</td>
                <td>Social</td>
            </tr>
            
        </table>
    </body>
</html>
